<html lang="zh-CN">
<head>
<link rel="preload" href="assets/display.min.woff2" as="font" type="font/woff2" crossorigin>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>吴好玮 · 平面视觉设计作品集</title>
<link rel="preload" href="assets/display.sub.ttf" as="font" type="font/ttf">
<style>
  @font-face{font-family:"Liuyun";src:url("assets/display.min.woff2") format("woff2");font-weight:400 900;font-style:normal;font-display:swap}
  :root{
    --bg:#efefec; --ink:#141617; --gray:#6a6d71; --line:#dad7cf;
    --card:#ffffff; --red:#C8352B; --ease:cubic-bezier(.16,1,.3,1);
    --pad:clamp(16px,2.2vw,40px);
    --r-xl:28px; --r-lg:20px; --r-md:14px; --r-sm:10px; --pill:999px;
    --disp:"Liuyun","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    --zh:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    --en:"Liuyun","Space Grotesk",sans-serif;
    /* 字号体系：h1 页面主标题 / h2 二级 / h3 三级 / body 正文 / sm 装饰元信息 */
    --fs-h1:clamp(40px,5.4vw,84px);
    --fs-h2:clamp(17px,1.7vw,21px);
    --fs-h3:clamp(14px,1.3vw,15.5px);
    --fs-body:clamp(13.5px,.95vw,14.5px);
    --fs-sm:10.5px;
    --fs-cap:14px; --fs-tag:11px; --ab-gap:42px; --sh:1;
        --w-h1:900; --w-h2:700; --w-sm:500;
    /* ============================================================
       ★★★ 可调参数 · 只改冒号后面的数字，别删分号和 var 调用 ★★★
       ============================================================ */
    /* 首页主标题「视觉设计」的字号上限（桌面端实际大小），现在 64 */
    --p-h1:64px;
    /* 章节标题「作品索引」「关于我」的字号上限，现在 64，跟上面一致才齐平 */
    --p-h2:64px;
    /* 首页右上角角标：宽度 / 高度 / 距标题顶部的距离，现在 200 / 147 / 8 */
    --p-cw:200px;
    --p-ch:147px;
    --p-ct:8px;
    /* 关于页手机版照片高度，现在 340 */
    --p-photo:340px;

  /* ══════ 01 · 基础重置：清零、字体、链接、容器宽度 ══════ */
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:auto}
  body{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  ::selection{background:var(--red);color:#fff}
  .mono{font-family:var(--en)}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1900px;margin:0 auto;padding:0 var(--pad)}
  img{display:block}
  .en{font-family:var(--en)}

  /* ========== 自定义光标 ========== */
  /* ══════ 02 · 自定义光标：桌面端跟随鼠标的黑白圆环，手机端隐藏 ══════ */
  #dot,#ring{position:fixed;top:0;left:0;z-index:9999;pointer-events:none;border-radius:50%;mix-blend-mode:difference;will-change:transform}
  #dot{width:6px;height:6px;background:#fff;margin:-3px 0 0 -3px}
  #ring{width:38px;height:38px;border:1px solid rgba(255,255,255,.6);margin:-19px 0 0 -19px;transition:width .3s var(--ease),height .3s var(--ease),margin .3s var(--ease),opacity .3s}
  #ring.big{width:76px;height:76px;margin:-38px 0 0 -38px;border-color:rgba(200,53,43,.9)}
  @media (pointer:coarse){#dot,#ring{display:none}}

  /* ========== 顶部 ========== */
  /* ══════ 03 · 顶部滚动进度条：页面往下滚时红色线从左侧长出来 ══════ */
    /* ══════ 04 · 顶部导航栏：毛玻璃底 + 三个入口 + 红色下划线跟随 ══════ */
  nav{position:fixed;top:0;left:0;right:0;z-index:70;background:rgba(239,239,236,.78);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .nav-in{display:flex;justify-content:center;align-items:center;height:78px;gap:clamp(24px,3.6vw,64px);margin:0 auto;padding:0 var(--pad)}
  .brand{font-weight:900;letter-spacing:-.01em;font-size:19px;white-space:nowrap;display:flex;align-items:center;gap:8px}
  .brand span{color:var(--gray);font-family:var(--en);font-size:9.5px;letter-spacing:.27em;font-weight:400;text-transform:uppercase;padding-top:2px}
  .ticker{flex:0 1 clamp(140px,38vw,560px);overflow:hidden;min-width:0;opacity:.5;mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
  .ticker .row{display:flex;gap:58px;white-space:nowrap;animation:slide 34s linear infinite;width:max-content}
  .ticker span{font-family:var(--en);font-size:12.5px;letter-spacing:.21em;text-transform:uppercase}
  /* ══════ 05 · 动画关键帧：跑马灯、进场、角标红条呼吸 ══════ */
  @keyframes slide{to{transform:translateX(-50%)}}
  .menu{display:flex;gap:34px;position:relative}
  .menu a{font-size:16.5px;font-weight:500;letter-spacing:.1em;color:var(--gray);position:relative;z-index:2;padding:6px 0;transition:color .3s}
  .menu a .no{font-family:var(--en);font-size:10px;position:absolute;bottom:-22px;left:1px;color:var(--line);letter-spacing:.09em}
  .menu a:last-child{margin-right:-.1em}
  .menu a:hover,.menu a.active{color:var(--ink)}
  .menu .nav-ink{position:absolute;left:0;bottom:-4px;width:0;height:9px;background:var(--red);transform:skewX(-16deg);transform-origin:left bottom;z-index:1;pointer-events:none;opacity:0;transition:left .8s cubic-bezier(.32,.94,.28,1),width .8s cubic-bezier(.32,.94,.28,1),opacity .2s ease}
  .menu .nav-ink.on{opacity:1}
  .menu .nav-ink.init{transition:none}

  /* ========== 动效基座 ========== */
  .js .rv{opacity:0;transform:translateY(36px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
  .js .rv.on{opacity:1;transform:none}
  .js .rv.d1{transition-delay:.07s}.js .rv.d2{transition-delay:.14s}.js .rv.d3{transition-delay:.21s}.js .rv.d4{transition-delay:.28s}
  .js .mask{clip-path:inset(0 0 100% 0);transition:clip-path 1.1s var(--ease)}
  .js .mask.on{clip-path:inset(0 0 0 0)}
  #view.in{animation:viewIn .55s var(--ease) both}
  @keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* ========== Hero ========== */
  /* ══════ 06 · 首页首屏 HERO：整个第一屏的容器 ══════ */
  .hero{position:relative;min-height:auto;display:flex;flex-direction:column;justify-content:flex-start;padding:clamp(92px,9.4vh,112px) 0 0;overflow:hidden}
  .hero-top{position:relative;z-index:3;max-width:1900px;margin:0 auto 0;width:100%;padding:0 var(--pad) 0;display:flex;justify-content:space-between;gap:20px;font-family:var(--zh);font-size:10.5px;letter-spacing:.25em;text-transform:uppercase;color:var(--gray)}
  .hero-main{position:relative;z-index:2;max-width:1900px;margin:0 auto;width:100%;padding:0 var(--pad);display:flex;flex-direction:column;justify-content:center;flex:1 1 auto}
  /* · 主标题块：中文主标题「视觉设计」+ 背后描边字 PORT FOLIO + 右上角角标，三层叠在一起 */
  .hero h1{position:relative;font-family:var(--disp);font-size:var(--p-h1);font-weight:var(--w-h1);line-height:1;letter-spacing:-.02em;isolation:isolate}
  .hero h1 .zh{position:absolute;left:0;top:50%;transform:translateY(-49%);z-index:3;font-family:var(--disp);font-weight:var(--w-h1);font-size:1em;letter-spacing:-.02em;white-space:nowrap}
  .hero h1 .bgw{display:block;position:relative;z-index:1;pointer-events:none;user-select:none}
  .hero h1 .bgw b{display:block;font-family:var(--en);font-weight:400;font-size:1.5em;line-height:1;letter-spacing:6px;color:transparent;-webkit-text-stroke:1px rgba(20,22,23,.34);white-space:nowrap}
  .hero h1 .bgw b:first-child{padding-left:.02em}
  .hero h1 .bgw b:last-child{padding-left:0}
  .hero h1 em{font-style:normal;color:var(--red)}
  /* · 首页角标：三根红斜条 + 黑色直角折线；尺寸由 --p-cw / --p-ch 控制，位置由 --p-ct 控制 */
  .hero h1 .corner{top:var(--p-ct);right:0;width:var(--p-cw);height:var(--p-ch)}
  .hero h1 .corner .rt{top:0;width:4.6%;height:24.5%}
  .hero h1 .corner .rt:nth-child(1){right:calc(16% + 9px)}
  .hero h1 .corner .rt:nth-child(2){right:calc(8% + 9px)}
  .hero h1 .corner .rt:nth-child(3){right:9px}
  .hero h1 .en{display:block;font-family:var(--en);font-size:clamp(10px,1vw,13px);font-weight:400;letter-spacing:.45em;color:var(--gray);margin-top:clamp(22px,2.6vw,34px)}
  .hero-grid{display:grid;grid-template-columns:1.35fr .65fr;gap:clamp(24px,4vw,56px);align-items:end;margin-top:clamp(30px,4.4vw,54px);padding-bottom:clamp(22px,2.6vw,34px);border-bottom:1px solid var(--line)}
  .hero-grid p{font-size:var(--fs-body);color:#3a3d40;max-width:580px}
  .hero-grid .side{text-align:right}
  .hero-grid .side .k{font-family:var(--en);font-size:10px;letter-spacing:.23em;color:var(--gray);text-transform:uppercase;display:block;margin-bottom:6px}
  .hero-grid .side .v{font-size:15px;font-weight:700}
  .hero-services{display:flex;flex-wrap:wrap;gap:8px 10px;margin-top:clamp(16px,2vw,24px)}
  .hero-services span{font-family:var(--en);font-size:10.5px;letter-spacing:.17em;text-transform:uppercase;border:1px solid rgba(255,255,255,.7);padding:7px 15px;color:var(--gray);background:rgba(255,255,255,.72);border-radius:var(--pill);backdrop-filter:blur(8px);box-shadow:0 2px 8px rgba(20,22,23,.04)}

  .hero-foot{position:relative;z-index:2;max-width:1900px;margin:0 auto;width:100%;padding:clamp(12px,1.4vw,18px) var(--pad) clamp(8px,1vw,14px);display:flex;justify-content:space-between;align-items:center;gap:20px;font-family:var(--en);font-size:10.5px;letter-spacing:.23em;text-transform:uppercase;color:var(--gray)}
  .hero-foot .scroll-cue{display:flex;align-items:center;gap:10px}
  .hero-foot .scroll-cue i{display:block;width:1px;height:38px;background:var(--ink);animation:drop 2.2s var(--ease) infinite}
  @keyframes drop{0%{transform:scaleY(.2);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}100%{transform:scaleY(.2);transform-origin:top}}
  .hero-foot a{border-bottom:1px solid var(--ink);color:var(--ink);padding-bottom:2px;transition:color .3s,border-color .3s}
  .hero-foot a:hover{color:var(--red);border-color:var(--red)}

  /* ========== 分类卡（首页索引） ========== */
  .cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,1.4vw,20px)}
  .cat-card{position:relative;display:block;border-radius:var(--r-lg);overflow:hidden;background:var(--bg);box-shadow:0 0 0 1px rgba(20,22,23,.055),0 calc(var(--sh)*3px) calc(var(--sh)*10px) rgba(20,22,23,.09),0 calc(var(--sh)*16px) calc(var(--sh)*40px) rgba(20,22,23,.12);transition:transform .55s var(--ease),box-shadow .55s var(--ease)}
  .cat-card:hover{transform:translateY(-4px);box-shadow:0 0 0 1px rgba(20,22,23,.07),0 calc(var(--sh)*10px) calc(var(--sh)*26px) rgba(20,22,23,.10),0 calc(var(--sh)*26px) calc(var(--sh)*58px) rgba(20,22,23,.16)}
  .cat-card .frame{display:block;position:relative;overflow:hidden;background:var(--bg);aspect-ratio:4/3;border-radius:var(--r-lg)}
  .cat-card .frame img{width:100%;height:100%;object-fit:cover;object-position:center top;transition:transform .9s var(--ease)}
  .cat-card:hover .frame img{transform:scale(1.05)}
  .cat-card .cap{display:block;padding:15px 17px 17px}
  .cat-card .cap .t{display:block;font-size:var(--fs-cap);font-weight:700;letter-spacing:-.01em;line-height:1.42}
  .cat-card .cap .sub{display:flex;justify-content:space-between;gap:10px;margin-top:9px;align-items:center}
  .cat-card .cap .sub i{font-style:normal;font-family:var(--zh);font-size:var(--fs-tag);letter-spacing:.14em;text-transform:uppercase;color:var(--red);background:rgba(200,53,43,.07);padding:4px 11px;border-radius:var(--pill)}
  .cat-card .cap .sub u{text-decoration:none;font-family:var(--zh);font-size:var(--fs-tag);letter-spacing:.08em;color:var(--gray);text-align:right}
  @media (max-width:900px){.cat-grid{grid-template-columns:repeat(2,1fr)}}
    @media (max-width:520px){.cat-grid{grid-template-columns:1fr 1fr;gap:10px}.cat-card .frame{aspect-ratio:1/1}.cat-card .cap{padding:11px 12px 12px}.cat-card .cap .t{font-size:12.5px}.cat-card .cap .sub{margin-top:6px}.cat-card .cap .sub i,.cat-card .cap .sub u{font-size:10px;letter-spacing:.08em}}

  /* ========== 章节头：编号在上，中文压在英文中间 ========== */
  .sec{padding:clamp(46px,6vw,92px) 0}
  /* 窄屏兜底：屏幕宽度不足 1100px 时主标题改回自适应，避免溢出 */
  @media (max-width:1100px){.hero h1{font-size:clamp(34px,4.7vw,var(--p-h1))}}

  /* ══════ 07 · 章节头：作品索引 / 关于 的编号、大标题、角标那一整块 ══════ */
  .sec-head{position:relative;display:block;margin-bottom:clamp(20px,2.8vw,38px);padding-top:16px}
  .sec-tags{display:flex;gap:16px;align-items:baseline;margin-bottom:12px}
  .sec-tags span{font-family:var(--en);font-size:10.5px;letter-spacing:.23em;color:var(--gray);font-weight:400;text-transform:uppercase}
  .sec-tags span:first-child{color:var(--red)}
  .sec-head h2{font-size:clamp(34px,4.7vw,var(--p-h2))}
  .stack2{position:relative;line-height:1;font-family:var(--disp)}
  .stack2 .bgw{display:block;position:relative;z-index:1}
  .stack2 .bgw b{display:block;font-family:var(--en);font-weight:400;font-size:1.5em;line-height:1.0;letter-spacing:6px;color:transparent;-webkit-text-stroke:1px rgba(20,22,23,.34);white-space:nowrap}
  .stack2 .bgw b:last-child{padding-left:0}
  .stack2 .zh{position:absolute;left:0;top:50%;transform:translateY(-49%);z-index:2;font-size:1em;font-weight:var(--w-h1);letter-spacing:-.025em;white-space:nowrap}
  .stack2 .zh em{font-style:normal;color:var(--red)}
  .sec-head .sfoot{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-top:clamp(12px,1.4vw,18px)}
  .sec-head .num{font-family:var(--zh);font-size:10.5px;letter-spacing:.19em;color:var(--red);white-space:nowrap}
  .sec-head .num b{font-size:10.5px;letter-spacing:.16em;font-weight:500}
  .sec-head .meta{font-family:var(--en);font-size:10.5px;letter-spacing:.17em;color:var(--gray);text-transform:uppercase;text-align:right;font-weight:var(--w-sm)}
  /* 角标：三块平行四边形 + 右下角朝左上的箭头 */
  /* · 章节通用角标：150×110 的小版，作品索引和关于页右上角都是它 */
  .corner{position:absolute;right:0;top:98.5px;width:var(--p-cw);height:var(--p-ch);pointer-events:none;opacity:.94}
  .corner .rt{position:absolute;top:0;width:4.6%;height:24.5%;background:var(--red);transform:skewX(-14deg);transform-origin:bottom left;z-index:2}
  .corner .rt:nth-child(1){right:calc(16% + 9px)}
  .corner .rt:nth-child(2){right:calc(8% + 9px)}
  .corner .rt:nth-child(3){right:9px}
  /* 章节角标：三根红条整体上移 10px，与下方折线拉开距离 */
  .sec-head .corner .rt{top:-10px}
  .corner svg{position:absolute;right:0;bottom:0;left:auto;top:auto;width:calc((100% - 7px) * .8);height:calc((68% - 3.5px) * .8);display:block;overflow:visible;z-index:1}
  .corner svg path{stroke:var(--ink);stroke-width:7;fill:none;stroke-linecap:square;stroke-linejoin:miter;vector-effect:non-scaling-stroke}
  .corner svg path:last-child{stroke-linecap:butt}

  /* ========== 作品索引（列表 + 悬浮预览） ========== */
  .index{border-top:1px solid var(--line)}
  .idx-row{display:grid;grid-template-columns:68px 1fr 160px 64px;gap:20px;align-items:center;padding:20px 0;border-bottom:1px solid var(--line);position:relative;cursor:pointer;transition:padding-left .5s var(--ease)}
  .idx-row:hover{padding-left:14px}
  .idx-row .no{font-family:var(--en);font-size:11px;letter-spacing:.13em;color:var(--gray)}
  .idx-row .tt{font-size:clamp(15px,1.5vw,20px);font-weight:700;letter-spacing:-.01em;transition:color .35s}
  .idx-row:hover .tt{color:var(--red)}
  .idx-row .cat{font-family:var(--zh);font-size:10.5px;letter-spacing:.21em;text-transform:uppercase;color:var(--gray);text-align:left}
  .idx-row .n{font-family:var(--zh);font-size:10.5px;letter-spacing:.13em;color:var(--gray);text-align:right}
  .idx-row .bar{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--red);transition:width .6s var(--ease)}
  .idx-row:hover .bar{width:100%}

  /* 悬浮预览 */
  #pv{position:fixed;z-index:60;width:250px;height:330px;pointer-events:none;opacity:0;visibility:hidden;transform:translate(-50%,-50%) scale(.94);transition:opacity .35s var(--ease),transform .35s var(--ease),visibility .35s;border:1px solid var(--line);background:var(--card);overflow:hidden;border-radius:var(--r-md);box-shadow:0 30px 60px rgba(20,22,23,.16)}
  #pv.show{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1)}
  #pv img{width:100%;height:100%;object-fit:contain;background:#f2f0ec}
  @media (max-width:900px){#pv{display:none}}
  @media (max-width:900px){.idx-row{grid-template-columns:44px 1fr auto;row-gap:4px}.idx-row .cat{grid-column:2;font-size:10px}.idx-row .n{grid-column:3;grid-row:1}}

  /* ========== 能力列表 ========== */
  .cap-list{border-top:1px solid var(--line)}
  .cap-row{display:grid;grid-template-columns:minmax(150px,230px) 1fr;gap:clamp(20px,3vw,44px);padding:clamp(22px,3vw,36px) 0;border-bottom:1px solid var(--line);align-items:start}
  .cap-row .n{font-family:var(--en);font-size:11px;letter-spacing:.17em;color:var(--gray);padding-top:6px}
  .cap-row h3{font-family:var(--zh);font-size:clamp(15px,1.35vw,17.5px);font-weight:var(--w-h2);letter-spacing:-.005em;line-height:1.4}
  .cap-row h3 em{display:block;font-style:normal;font-family:var(--en);font-size:9px;font-weight:400;letter-spacing:.19em;text-transform:uppercase;color:rgba(20,22,23,.32);margin-top:5px}
  .cap-row p{font-size:13.5px;color:var(--gray);max-width:520px}
  @media (max-width:760px){.cap-row{grid-template-columns:1fr;row-gap:6px}.cap-row p{grid-column:1}}

  /* ========== 作品网格（瀑布流） ========== */
  .filter{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-bottom:clamp(26px,3vw,44px)}
  .filter button{width:100%;white-space:nowrap;overflow:hidden}
  .filter button{font-family:inherit;font-size:12px;letter-spacing:.04em;padding:10px 14px;border:1px solid var(--line);background:rgba(255,255,255,.66);cursor:pointer;color:var(--gray);border-radius:var(--pill);transition:all .4s var(--ease);backdrop-filter:blur(8px)}
  .filter button:hover{color:var(--ink);border-color:var(--ink);background:#fff}
  .filter button.on{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 12px 26px rgba(20,22,23,.16)}

  /* ══════ 08 · 瀑布流作品网格：四列等高分配，卡片高度不齐 ══════ */
  .masonry{display:grid;grid-template-columns:repeat(4,1fr);gap:0 clamp(12px,1.5vw,20px);align-items:start}
  .masonry .mcol{display:flex;flex-direction:column;min-width:0}
  .masonry .mcol .work{margin:0 0 clamp(14px,1.8vw,24px);width:100%}
  @media (max-width:1240px){.masonry{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:680px){

#lab{position:fixed;right:16px;bottom:16px;z-index:88;width:258px;background:rgba(252,252,250,.97);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 64px rgba(20,22,23,.2);padding:13px 15px 12px;font-family:var(--zh);font-size:12px;color:var(--ink);display:none;backdrop-filter:blur(14px)}
#lab.on{display:block}
#lab .hd{display:flex;justify-content:space-between;align-items:center;padding-bottom:9px;border-bottom:1px solid var(--line);margin-bottom:11px}
#lab .hd b{font-family:var(--en);font-size:10px;letter-spacing:.2em;font-weight:400;color:var(--red)}
#lab .hd span{font-size:15px;cursor:pointer;line-height:1;color:var(--gray);padding:0 2px}
#lab .hd span:hover{color:var(--ink)}
#lab .f{margin-bottom:10px}
#lab .f .lb{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;color:#4a4d51}
#lab .f .lb em{font-style:normal;font-family:var(--en);font-size:10px;letter-spacing:.05em;color:var(--red)}
#lab input[type=range]{width:100%;accent-color:var(--red);height:15px;cursor:pointer}
#lab input[type=color]{width:100%;height:23px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:1px;cursor:pointer}
#lab .btns{display:flex;gap:6px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
#lab .btns button{flex:1;font-family:var(--zh);font-size:11px;padding:7px 0;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;color:var(--ink);transition:border-color .25s,color .25s}
#lab .btns button:hover{border-color:var(--red);color:var(--red)}
#lab .tip{margin-top:8px;font-size:10px;color:var(--gray);line-height:1.55}
#lab .tip b{font-weight:600;color:var(--ink)}

/* ============ 导航红块：跟随选中项缓动滑动 ============ */
const navInk = document.querySelector('.menu .nav-ink');
let inkReady = false;
function placeInk(instant){
  const a = document.querySelector('.menu a.active');
  if(!navInk) return;
  if(!a){ navInk.classList.remove('on'); return; }
  if(instant) navInk.classList.add('init');
  navInk.style.width = (a.offsetWidth + 8) + 'px';
  navInk.style.left = (a.offsetLeft - 4) + 'px';
  navInk.classList.add('on');
  if(instant){
    requestAnimationFrame(()=>requestAnimationFrame(()=>navInk.classList.remove('init')));
  }
}
function syncNavInk(){
  placeInk(!inkReady);
  inkReady = true;
}
addEventListener('resize', ()=>placeInk(true));
const pad = n => String(n).padStart(3,'0');
/* 大标题双色：以「 · 」切段，尾段描红；无分段时取末两字 */
function titleEm(t){
  const i = t.lastIndexOf(' · ');
  if(i > 0) return t.slice(0, i + 3) + '<em>' + t.slice(i + 3) + '</em>';
  return t.length > 4 ? t.slice(0, -2) + '<em>' + t.slice(-2) + '</em>' : t;
}

let __prevPath = '', __listY = 0, __worksNodes = null, __worksCat = null;
function router(){
  const hash = location.hash.replace(/^#\/?/, '') || 'home';
  const [path, query] = hash.split('?');
  const params = new URLSearchParams(query||'');
  let view;
  const elNow = $('#view');
  // 离开作品列表时：整块 DOM 节点与滚动高度一起留存，返回时原样接回
  if(__prevPath==='works' && !path.startsWith('works') && elNow && elNow.children.length){
    __worksNodes = Array.from(elNow.children);
    __listY = window.scrollY || document.documentElement.scrollTop || 0;
  }
  const catNow = path==='works' ? (params.get('cat')||'all') : '';
  const reuseList = (path==='works' && __worksNodes && catNow===__worksCat);
  if(path==='works') view = worksView(params.get('cat'));
  else if(path.startsWith('work/')) view = workView(path.split('/')[1]);
  else if(path==='about') view = aboutView();
  else view = homeView();

  const el = $('#view');
  if(reuseList){
    el.innerHTML = '';
    __worksNodes.forEach(n=>el.appendChild(n));
  } else {
    el.innerHTML = view;
    el.classList.remove('in'); void el.offsetWidth; el.classList.add('in');
    if(path==='works') __worksCat = catNow;
  }

  document.querySelectorAll('.menu a').forEach(a=>{
    const k = a.dataset.nav;
    a.classList.toggle('active', path.startsWith(k) || (k==='works' && path.startsWith('work/')));
  });
  syncNavInk();

  reflowMasonry();
  observe();
  if(reuseList){
    window.scrollTo(0, __listY);
  } else {
    window.scrollTo(0,0);
  }
  __prevPath = path;
}

/* 瀑布流：按最短列依次放，保证靠前的作品永远在上面 */
function reflowMasonry(){
  const box = document.querySelector('.masonry');
  if(!box || box.dataset.flow) return;
  const cols = innerWidth > 1240 ? 4 : 2;
  const cards = [...box.children];
  if(!cards.length) return;
  box.dataset.flow = '1';
  box.innerHTML = '';
  const holders = [];
  for(let i=0;i<cols;i++){
    const c = document.createElement('div');
    c.className = 'mcol';
    box.appendChild(c);
    holders.push(c);
  }
  // 前两行按序号铺满（ZIPPO 置顶），其余按最短列填充，避免某列被抽空留下大片空白
  cards.forEach((card,i)=>{
    if(i < cols * 2){ holders[i%cols].appendChild(card); return; }
    let k=0, min=Infinity;
    holders.forEach((h,j)=>{ const hh=h.offsetHeight; if(hh<min){ min=hh; k=j; } });
    holders[k].appendChild(card);
  });
  // 不再做底部 V 形错位：shapeTail 会把顶部卡片搬走，破坏 ZIPPO 置顶顺序
  observe();
}
/* 收尾：把列底压成高低交错的锯齿，落差控制在一张作品以内 */
function shapeTail(){
  const box = document.querySelector('.masonry');
  if(!box) return;
  const cs = [...box.querySelectorAll('.mcol')];
  if(cs.length < 3 || box.dataset.shaped === '1') return;
  const H = () => cs.map(c=>c.offsetHeight);
  if(Math.min(...H()) < 240) return;
  const LIM = cs.length === 4 ? 120 : 240;
  for(let t=0;t<12;t++){
    const cur = H();
    const mx = Math.max(...cur), mn = Math.min(...cur);
    const before = mx - mn;
    if(before <= LIM) break;
    const iMax = cur.indexOf(mx), iMin = cur.indexOf(mn);
    const kids = [...cs[iMax].children];
    if(kids.length < 2) break;
    const half = before / 2;
    let best = kids[kids.length-1], bd = 1e9;
    kids.slice(-12).forEach(k=>{ const d = Math.abs(k.offsetHeight - half); if(d < bd){ bd = d; best = k; } });
    const prev = best.nextElementSibling;
    cs[iMin].appendChild(best);
    const after = Math.max(...H()) - Math.min(...H());
    if(after > before - 5){ cs[iMax].insertBefore(best, prev); break; }
  }

  box.dataset.shaped = '1';
}
window.addEventListener('resize', ()=>{ document.querySelectorAll('.masonry').forEach(m=>{ delete m.dataset.flow; delete m.dataset.shaped; }); reflowMasonry(); alignCorners(); });

/* ============ 角标垂直对齐 ============ */
function shiftCorner(co, target, dy){
  const cr = co.getBoundingClientRect(), tr = target.getBoundingClientRect();
  if(!cr.height || !tr.height) return;
  let cur = parseFloat(getComputedStyle(co).top);
  if(isNaN(cur)) cur = co.offsetTop || 0;
  co.style.top = Math.round(cur + (tr.bottom - cr.bottom) + (dy || 0)) + 'px';
}
function alignCorners(){
  document.querySelectorAll('.sec-head .corner').forEach(co=>{
    const head = co.parentElement;
    const sf = head.querySelector('.sfoot');
    if(sf) shiftCorner(co, sf, -1);
  });
}

/* ============ 进场观察 ============ */
let io;
function observe(){
  if(io) io.disconnect();
  setTimeout(alignCorners, 120);
  setTimeout(alignCorners, 600);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>setTimeout(alignCorners, 60));
  io = new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('on'); io.unobserve(e.target); } });
  },{threshold:.12, rootMargin:'0px 0px -8% 0px'});
  document.querySelectorAll('.rv,.mask').forEach(el=>io.observe(el));
  setTimeout(()=>document.querySelectorAll('.rv,.mask').forEach(el=>{
    if(el.getBoundingClientRect().top < innerHeight) el.classList.add('on');
  }),80);
}

<script>
/* 实时调参面板：只影响本机预览，不写入代码；调完"复制参数"发我即可固化 */
(function(){
  var root=document.documentElement, box=null;
  var R=[
    {k:'--fs-cap',n:'卡片标题字号',min:9,max:20,step:0.5},
    {k:'--fs-tag',n:'胶囊 / 英文',min:8,max:18,step:0.5},
    {k:'--r-lg',n:'卡片圆角',min:0,max:28,step:1},
    {k:'--ab-gap',n:'关于页栏间距',min:8,max:90,step:1},
    {k:'--sh',n:'卡片阴影强度',min:0,max:2.5,step:0.05,u:''}
  ];
  var C=[{k:'--bg',n:'页面底色'},{k:'--red',n:'主色'}];
  function cur(k){ return getComputedStyle(root).getPropertyValue(k).trim(); }
  function num(k){ return parseFloat(cur(k))||0; }
  function setTip(t){ var el=box&&box.querySelector('#labtip'); if(el) el.innerHTML=t; }
  function cssText(){ return R.concat(C).map(function(o){ return o.k+':'+cur(o.k); }).join('; '); }
  function build(){
    box=document.createElement('div'); box.id='lab';
    box.innerHTML='<div class="hd"><b>LAB · 实时调参</b><span id="labx">×</span></div><div id="labf"></div><div class="btns"><button data-a="copy">复制参数</button><button data-a="reset">重置</button></div><p class="tip" id="labtip">改完点<b>复制</b>，把数值发我固化进代码。只在本机预览生效。</p>';
    document.body.appendChild(box);
    var f=box.querySelector('#labf');
    R.forEach(function(o){
      var u=o.u===undefined?'px':o.u;
      var row=document.createElement('div'); row.className='f';
      row.innerHTML='<div class="lb"><span>'+o.n+'</span><em>'+num(o.k)+u+'</em></div>'+
        '<input type="range" min="'+o.min+'" max="'+o.max+'" step="'+o.step+'" value="'+num(o.k)+'" data-k="'+o.k+'" data-u="'+u+'">';
      f.appendChild(row);
      var r=row.querySelector('input'), v=row.querySelector('em');
      r.addEventListener('input',function(){ root.style.setProperty(o.k, r.value+u); v.textContent=r.value+u; });
    });
    C.forEach(function(o){
      var row=document.createElement('div'); row.className='f';
      row.innerHTML='<div class="lb"><span>'+o.n+'</span><em>'+cur(o.k)+'</em></div>'+
        '<input type="color" value="'+cur(o.k)+'" data-k="'+o.k+'">';
      f.appendChild(row);
      var r=row.querySelector('input'), v=row.querySelector('em');
      r.addEventListener('input',function(){ root.style.setProperty(o.k, r.value); v.textContent=r.value; });
    });
    box.querySelector('#labx').addEventListener('click', function(){ box.classList.remove('on'); });
    box.addEventListener('click', function(e){
      var a=e.target.getAttribute&&e.target.getAttribute('data-a'); if(!a) return;
      if(a==='copy'){
        var txt=cssText();
        if(navigator.clipboard&&navigator.clipboard.writeText){
          navigator.clipboard.writeText(txt).then(function(){ setTip('已复制：<b>'+txt+'</b>'); }, function(){ setTip('复制失败，请手动记：<b>'+txt+'</b>'); });
        } else { setTip('请手动记：<b>'+txt+'</b>'); }
      } else {
        R.concat(C).forEach(function(o){ root.style.removeProperty(o.k); });
        box.querySelectorAll('#labf input').forEach(function(i){
          var u=i.dataset.u||'px';
          i.value = i.type==='color' ? cur(i.dataset.k) : num(i.dataset.k);
          var em=i.parentNode.querySelector('em'); em.textContent = i.type==='color' ? cur(i.dataset.k) : num(i.dataset.k)+u;
        });
        setTip('已重置为出厂参数。');
      }
    });
  }
  function toggle(){
    if(!box) build();
    box.classList.toggle('on');
  }
  if(/[?&]lab=1/.test(location.search)) { toggle(); }
  document.addEventListener('keydown', function(e){
    if((e.ctrlKey||e.metaKey)&&e.shiftKey&&(e.key==='l'||e.key==='L')){ e.preventDefault(); toggle(); }
  });
  var hits=0, timer=null;
  document.addEventListener('click', function(e){
    var el=e.target.closest?e.target.closest('.brand'):null; if(!el) return;
    hits++; clearTimeout(timer); timer=setTimeout(function(){hits=0;},900);
    if(hits>=3){ hits=0; toggle(); }
  }, true);
})();
</script>

<script>
/* 自动保比例：只要改 --p-cw（角标宽度），高度会按 200:147 自动算，永远不会拉伸变形 */
(function(){
  var root=document.documentElement, ratio=147/200;
  function sync(){
    var cw=parseFloat(getComputedStyle(root).getPropertyValue('--p-cw'))||200;
    root.style.setProperty('--p-ch',(cw*ratio).toFixed(2)+'px');
  }
  sync();
  if (window.ResizeObserver){
    var last=null;
    new ResizeObserver(function(){var v=getComputedStyle(root).getPropertyValue('--p-cw'); if(v!==last){last=v;sync();}})
      .observe(root,{attributes:true});
  }
})();
</script>

    var c=document.querySelector('.hero h1 .corner');
    var h=document.querySelector('.hero h1');
    var cr=c?c.getBoundingClientRect():{width:0,height:0};
    var fs=h?getComputedStyle(h).fontSize:'-';
    d.textContent='主标题 '+fs+'   角标 '+Math.round(cr.width)+'×'+Math.round(cr.height)
      +'   距顶 '+val('--p-ct')
      +'\n原始参数 --p-cw: '+val('--p-cw')+'  --p-ch: '+val('--p-ch');
    d.style.color='#fff';
  }
  setTimeout(function(){document.body.appendChild(d);paint();},600);
});
</script>

<script>
/* 详情页大图适配：不裁剪、不拉伸。宽度最多放到原图的 1.35 倍，超过就居中留白 */
(function(){
  function fit(){
    var imgs=document.querySelectorAll('.d-hero img,.stream-flow img,.shots img');
    imgs.forEach(function(img){
      function go(){
        var cw=img.parentElement.clientWidth||0; if(cw<80){cw=(document.querySelector('.wrap')||{}).clientWidth||1400;} 
        var nw=img.naturalWidth||0; if(!nw)return;
        if(img.closest('.d-hero')){
          if(window.innerWidth<=640){ img.style.maxWidth=Math.round(cw*0.96)+'px'; img.style.marginLeft='auto'; img.style.marginRight='auto'; return; }
          var nh0=img.naturalHeight||1, rr=nw/nh0;
          var t=Math.min(1,Math.max(0,(rr-0.5)/0.7));
          img.style.maxWidth=Math.round(cw*(0.40+0.30*t))+'px';
        }else{
          img.style.maxWidth=Math.round(Math.min(cw,Math.max(nw*1.35,480)))+'px';
        }
        img.style.marginLeft='auto'; img.style.marginRight='auto';
      }
      if(img.complete&&img.naturalWidth) go(); else img.addEventListener('load',go,{once:true});
    });
  }
  fit();
  window.addEventListener('hashchange',function(){setTimeout(fit,350)});
  setTimeout(fit,800);
})();
</script>

<script>
/* 箭头底部对齐描边字底部：量差值直接设 bottom，不用 transform，不动画 */
(function(){
  function align(){
    document.querySelectorAll('.corner').forEach(function(c){
      var svg=c.querySelector('svg'); if(!svg) return;
      var scope=c.closest('.hero h1')||c.closest('.sec-head');
      if(!scope) return;
      var bg=scope.querySelector('.bgw'); if(!bg) return;
      svg.style.bottom='0px';
      var d=Math.round(bg.getBoundingClientRect().bottom - svg.getBoundingClientRect().bottom);
      svg.style.bottom=(10-d)+'px';  /* 抵消行盒底部留白，让箭头压在字形底部上 */
    });
  }
  align();
  window.addEventListener('resize',align);
  window.addEventListener('hashchange',function(){setTimeout(align,400)});
  setTimeout(align,900);
})();
</script>

<script>
/* 角标对齐：红条顶部压描边字字形顶部；箭头底部压字形底部；两者都贴内容右边缘 */
(function(){
  function align(){
    document.querySelectorAll('.corner').forEach(function(c){
      var scope=c.closest('.hero h1')||c.closest('.sec-head');
      if(!scope) return;
      var bg=scope.querySelector('.bgw'); if(!bg) return;
      var b=bg.querySelector('b');
      var fs=b?parseFloat(getComputedStyle(b).fontSize):96;
      var capTop=fs*0.27, capBottom=fs*0.11;   /* 行盒上下留白，按字号比例 */

      var rts=c.querySelectorAll('.rt');
      rts.forEach(function(rt){
        rt.style.transform='none';
        var cur=rt.getBoundingClientRect().top;
        var target=bg.getBoundingClientRect().top+capTop;
        var dv=Math.round(target-cur);
        rt.style.transform='translateY('+dv+'px) skewX(-14deg)';
      });

      var firstRt=c.querySelector('.rt');
      var m=scope.querySelector('.meta');
      if(m&&firstRt){
        m.style.position='absolute'; m.style.right='0'; m.style.margin='0';
        var hr=scope.getBoundingClientRect();
        var gap=(window.innerWidth<=640)?20:10;
        m.style.top=Math.round(firstRt.getBoundingClientRect().top-hr.top-(m.offsetHeight||16)-gap)+'px';
      }

      var svg=c.querySelector('svg');
      if(svg){
        svg.style.bottom='0px';
        var d=bg.getBoundingClientRect().bottom - svg.getBoundingClientRect().bottom - capBottom;
        svg.style.bottom=(-Math.round(d))+'px';
      }
    });
  }
  align();
  window.addEventListener('resize',align);
  window.addEventListener('hashchange',function(){setTimeout(align,400)});
  setTimeout(align,900);
})();
/* OPEN TO WORK：块底压在照片视觉底（图片比容器低 2.5%） */
(function(){
  function placeNow(){
    var fig=document.querySelector('.ab-figure'), now=document.querySelector('.ab-now');
    if(!fig||!now) return;
    var img=fig.querySelector('img'); if(!img||!img.getBoundingClientRect().height) return;
    now.style.marginTop='0px';
    var ib=img.getBoundingClientRect().bottom, fb=fig.getBoundingClientRect().bottom;
    var nh=now.offsetHeight;
    now.style.marginTop=Math.round(ib-nh-fb)+'px';
  }
  placeNow();
  window.addEventListener('resize',placeNow);
  window.addEventListener('hashchange',function(){setTimeout(placeNow,450)});
  setTimeout(placeNow,1000);
})();
/* 详情页标题：强制单行，按可用宽度自适应字号，右侧留空 */
(function(){
  function fitTitle(){
    document.querySelectorAll('.d-head .d-ttl h1').forEach(function(h){
      h.style.fontSize=''; h.style.whiteSpace='nowrap';
      var box=h.parentElement.clientWidth||0; if(!box) return;
      var fs=parseFloat(getComputedStyle(h).fontSize)||40, guard=0;
      while(h.scrollWidth>box+3 && fs>30 && guard++<60){ fs-=1; h.style.fontSize=fs+'px'; }
      if(h.scrollWidth>box+3) h.style.whiteSpace='normal';
    });
    document.querySelectorAll('.d-head .d-ttl .en-big').forEach(function(e){
      e.style.whiteSpace='normal'; e.style.fontSize='';
    });
  }
  fitTitle();
  window.addEventListener('resize',fitTitle);
  window.addEventListener('hashchange',function(){setTimeout(fitTitle,420)});
  setTimeout(fitTitle,900);
})();
</script>
